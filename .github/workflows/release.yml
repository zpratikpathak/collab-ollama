name: Release and Publish

on:
  push:
    branches: [home]
    paths:
      - pyproject.toml

jobs:
  release-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get current version
        id: current
        run: |
          version=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Get previous version
        id: previous
        run: |
          version=$(git show HEAD~1:pyproject.toml | grep '^version' | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.current.outputs.version != steps.previous.outputs.version
        run: gh release create "v${{ steps.current.outputs.version }}" --title "v${{ steps.current.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish to PyPI
        if: steps.current.outputs.version != steps.previous.outputs.version
        run: |
          pip install uv
          uv build
          uv publish
